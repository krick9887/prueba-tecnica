name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug workspace
        run: |
          echo "Workspace root: $(pwd)"
          echo "Top-level files:"; ls -la || true
          echo "prueba-tecnica/ files:"; ls -la prueba-tecnica || true

      - name: Install dependencies (auto-detect)
        run: |
          if [ -f package.json ]; then
            echo "Found package.json at repo root";
            npm ci;
          elif [ -f ./prueba-tecnica/package.json ]; then
            echo "Found package.json in ./prueba-tecnica";
            cd ./prueba-tecnica && npm ci;
          else
            echo "package.json not found in repo root or ./prueba-tecnica";
            ls -la || true;
            exit 1;
          fi

      - name: Build Angular App (auto-detect)
        run: |
          if [ -f package.json ]; then
            echo "Building from repo root";
            npx ng build --base-href=/prueba-tecnica/;
          elif [ -f ./prueba-tecnica/package.json ]; then
            echo "Building from ./prueba-tecnica";
            cd ./prueba-tecnica && npx ng build --base-href=/prueba-tecnica/;
          else
            echo "package.json not found for build"; exit 1;
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'prueba-tecnica/dist/prueba-tecnica'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4